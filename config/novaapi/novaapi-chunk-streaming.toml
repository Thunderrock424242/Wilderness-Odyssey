[chunkStreaming]
	#Master toggle for the chunk streaming pipeline.
	enabled = true
	#Maximum number of hot (ticking/rendered) chunks to retain before demoting to warm cache.
	# Default: 128
	# Range: 16 ~ 4096
	hotCacheLimit = 128
	#Maximum number of warm cached chunks to keep around without ticking.
	# Default: 256
	# Range: 32 ~ 8192
	warmCacheLimit = 256
	#Enable separate hot and warm caches (warm = non-ticking, hot = ticking/rendered).
	splitWarmCache = true
	#Ticks to wait before flushing a chunk save so rapid edits can be coalesced.
	# Default: 20
	# Range: 0 ~ 200
	saveDebounceTicks = 20
	#How long (in ticks) a player ticket should keep a chunk alive after the player leaves range.
	# Default: 200
	# Range: 20 ~ 1200
	playerTicketTtl = 200
	#How long (in ticks) an entity ticket should keep a chunk alive after the entity departs.
	# Default: 160
	# Range: 20 ~ 1200
	entityTicketTtl = 160
	#How long (in ticks) redstone activity should keep a chunk loaded.
	# Default: 80
	# Range: 10 ~ 600
	redstoneTicketTtl = 80
	#How long (in ticks) structure generation tickets remain valid.
	# Default: 400
	# Range: 40 ~ 2400
	structureTicketTtl = 400
	#Maximum parallel chunk I/O operations submitted at once.
	# Default: 4
	# Range: 1 ~ 64
	maxParallelIo = 4
	#Compression level to use when writing chunk NBT.
	# Default: 6
	# Range: 1 ~ 9
	compressionLevel = 6
	#Compression codec to use for chunk payloads.
	#Allowed Values: VANILLA_GZIP, ZSTD, LZ4
	compressionCodec = "VANILLA_GZIP"
	#Whether to spin up one I/O executor per dimension instead of sharing a global pool.
	perDimensionExecutors = false
	#Worker count for dedicated chunk I/O executors.
	# Default: 8
	# Range: 1 ~ 32
	ioThreads = 8
	#Maximum queued chunk I/O tasks per executor before new submissions are rejected.
	# Default: 128
	# Range: 16 ~ 4096
	ioQueueSize = 128
	#Default slice size (in bytes) for pooled buffers used by NBT and mesh processing.
	# Default: 16384
	# Range: 1024 ~ 262144
	bufferSliceBytes = 16384
	#Maximum number of pooled slices retained per worker thread.
	# Default: 8
	# Range: 1 ~ 64
	bufferSlicesPerThread = 8
	#If true, block entity and random ticks are skipped for warm-cached chunks.
	skipWarmCacheTicking = true
	#Radius (in blocks) around players where fluid and redstone random ticks run at full speed. Set to 0 to disable throttling.
	# Default: 96
	# Range: 0 ~ 512
	fluidRedstoneThrottleRadius = 96
	#Tick interval for throttled fluid/redstone random ticks outside the configured radius.
	# Default: 4
	# Range: 1 ~ 40
	fluidRedstoneThrottleInterval = 4
	#Minimum multiplier applied to random tick density in low-movement areas.
	# Default: 0.35
	# Range: 0.05 ~ 2.0
	randomTickMinScale = 0.35
	#Maximum multiplier applied to random tick density around fast-moving players.
	# Default: 1.25
	# Range: 0.25 ~ 3.0
	randomTickMaxScale = 1.25
	#Player movement speed (blocks/tick) that triggers the maximum random tick multiplier.
	# Default: 0.28
	# Range: 0.05 ~ 0.8
	movementSpeedForMaxScale = 0.28
	#Radius (in blocks) where player movement influences random tick scaling.
	# Default: 128
	# Range: 32 ~ 256
	randomTickPlayerBand = 128
	#Maximum number of cached biome/noise slice hashes to retain for interning.
	# Default: 384
	# Range: 64 ~ 2048
	sliceInternLimit = 384
	#Number of chunk changes that can be streamed as deltas before forcing a full sync.
	# Default: 256
	# Range: 32 ~ 4096
	deltaChangeBudget = 256
	#Compression level to use when sending individual light bands to players.
	# Default: 6
	# Range: 1 ~ 9
	lightCompressionLevel = 6
	#Interval (in ticks) to batch dirty chunk writes using the scheduled flush task.
	# Default: 20
	# Range: 1 ~ 200
	writeFlushIntervalTicks = 20
	#Maximum chunk mesh rebuilds to start per tick.
	# Default: 4
	# Range: 0 ~ 64
	maxMeshRebuildsPerTick = 4
	#Maximum chunk mesh upload tasks to dispatch to the render thread per tick.
	# Default: 16
	# Range: 0 ~ 256
	meshUploadBatchSize = 16
	#Folder name used for chunk cache storage.
	cacheFolderName = "chunk-cache"
	#If true, chunk cache data is stored under the world-specific config folder instead of the global config directory.
	storeCacheInWorldConfig = true
