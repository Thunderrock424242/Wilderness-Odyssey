["General Settings"]
	#Enable Nova API. If false, all features are disabled.
	enableNovaAPI = true

["Chunk Optimization Settings"]
	#Enable optimized chunk loading and retention.
	enableChunkOptimizations = true
	#Use multi-threaded chunk loading to reduce lag.
	asyncChunkLoading = true
	#Keep frequently accessed chunks loaded for longer to prevent constant reloads.
	smartChunkRetention = true

["Render Culling Settings"]
	#Enable occlusion culling for entity instanced rendering. Disable if compatibility issues arise.
	enableOcclusionCulling = true
