
version: 2

updates:
  # WEBSITE BRANCH
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "website"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0

  # BOT BRANCH
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "bot"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0

  # WEBSITE GITHUB ACTIONS
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "website"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0

  # BOT GITHUB ACTIONS
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "bot"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
