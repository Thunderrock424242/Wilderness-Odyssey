name: Disposable Minecraft server QA

on:
  workflow_dispatch:
    inputs:
      accept_eula:
        description: 'I accept the Minecraft EULA for this disposable test server'
        required: true
        type: boolean
        default: false
      memory_mb:
        description: 'Hosted-runner maximum heap (MiB)'
        type: choice
        options: ['2048', '4096', '6144']
        default: '4096'
      profiling:
        description: 'Diagnostic overhead'
        type: choice
        options: [basic, 'off', jfr, native]
        default: basic
      isolate:
        description: 'Confirm and isolate only an uncertain reproducible startup/soak crash (bounded)'
        type: boolean
        default: false
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

concurrency:
  group: modpack-server-qa
  cancel-in-progress: false

jobs:
  server:
    # No public PR or public-repository self-hosted execution path exists.
    # Scheduled runs are inert until a maintainer deliberately enables both vars.
    if: >-
      github.repository == 'Thunderrock424242/Wilderness-Odyssey' &&
      github.ref == 'refs/heads/1.21-neoforge' &&
      ((github.event_name == 'workflow_dispatch' && inputs.accept_eula) ||
      (github.event_name == 'schedule' && vars.ENABLE_MODPACK_QA_SCHEDULE == 'true' &&
      vars.MODPACK_QA_BASELINE_VALIDATED == 'true' && vars.MODPACK_QA_ACCEPT_EULA == 'true'))
    environment: modpack-qa
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/pack-cache
          key: pack-qa-${{ runner.os }}-${{ hashFiles('modpack/lock.json', 'qa/tool-lock.json') }}
      - name: Reconstruct, start, soak, stop and classify
        env:
          QA_REPORTS: ${{ runner.temp }}/pack-qa-reports
          QA_INSTANCE: ${{ runner.temp }}/pack-qa-instance
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          HEAP_MB: ${{ inputs.memory_mb || '4096' }}
          PROFILE_MODE: ${{ inputs.profiling || 'basic' }}
          ISOLATE_CRASH: ${{ inputs.isolate || false }}
        shell: bash
        run: |
          flags=()
          if [ "$ISOLATE_CRASH" = 'true' ]; then flags+=(--isolate); fi
          python -m tools.modpack qa --destination "$QA_INSTANCE" --reports "$QA_REPORTS" \
            --cache "$RUNNER_TEMP/pack-cache" --accept-eula --memory-mb "$HEAP_MB" \
            --profiling "$PROFILE_MODE" --startup-seconds 600 --soak-seconds 120 \
            --max-tests 12 "${flags[@]}"
      - name: Diagnostic summary
        if: always()
        env:
          QA_REPORTS: ${{ runner.temp }}/pack-qa-reports
        shell: bash
        run: |
          if [ -f "$QA_REPORTS/report.md" ]; then
            cat "$QA_REPORTS/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'QA failed before a server report was available. Minecraft readiness is unverified; inspect the failed setup step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Diagnostics artifact: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: minecraft-server-diagnostics
          path: ${{ runner.temp }}/pack-qa-reports/
          retention-days: 7
          if-no-files-found: warn
