name: Manual Security Scan

on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Comma-separated branches; blank = selected branch'
        required: false
        default: ''
        type: string
      fail_on_high:
        description: 'Fail the scan if HIGH or CRITICAL issues are found'
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.resolve.outputs.branches }}
    steps:
      - name: Resolve branches
        id: resolve
        env:
          REQUESTED_BRANCHES: ${{ inputs.branches }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os

          raw = os.environ['REQUESTED_BRANCHES'].strip()
          branches = [x.strip() for x in raw.split(',') if x.strip()] if raw else [os.environ['SELECTED_BRANCH']]
          branches = list(dict.fromkeys(branches))
          if not 1 <= len(branches) <= 20:
              raise SystemExit('Choose between 1 and 20 branches.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('branches=' + json.dumps(branches) + '\n')
          print('Scanning branches:', ', '.join(branches))
          PY

  scan:
    needs: prepare
    runs-on: ubuntu-latest
    name: Scan ${{ matrix.branch }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        branch: ${{ fromJSON(needs.prepare.outputs.branches) }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Make safe report name
        id: report
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          safe=$(printf '%s' "$BRANCH" | tr -c '[:alnum:]._-' '_' | cut -c1-40)
          hash=$(printf '%s' "$BRANCH" | sha256sum | cut -c1-8)
          echo "name=security-${safe}-${hash}" >> "$GITHUB_OUTPUT"

      - name: Record the checked-out branch commit
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Scan for GitHub code scanning alerts (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Send findings to GitHub Security > Code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-manual-${{ matrix.branch }}
          ref: refs/heads/${{ matrix.branch }}
          sha: ${{ steps.target.outputs.sha }}

      - name: Scan dependencies, secrets, and configuration (JSON backup)
