
name: Sync dependency snapshots to default branch

on:
  push:
    branches:
      - website
      - bot
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wilderness-odyssey-dependency-snapshot-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Update website and bot dependency snapshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default modpack branch
        uses: actions/checkout@v4
        with:
          ref: 1.21-neoforge
          path: main
          persist-credentials: true

      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          ref: website
          path: website
          persist-credentials: false

      - name: Checkout bot branch
        uses: actions/checkout@v4
        with:
          ref: bot
          path: bot
          persist-credentials: false

      - name: Copy only dependency manifests
        shell: bash
        run: |
          set -euo pipefail

          for project in website bot; do
            test -f "$project/package.json"
            test -f "$project/package-lock.json"

            mkdir -p "main/security-manifests/$project"

            cp \
              "$project/package.json" \
              "$project/package-lock.json" \
              "main/security-manifests/$project/"
          done

      - name: Create or update dependency snapshot PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: main
          base: 1.21-neoforge
          branch: automation/dependency-snapshots

          commit-message: "chore: synchronize website and bot dependency snapshots"

          title: "chore: synchronize website and bot dependency snapshots"

          body: |
            ## Automated Dependency Snapshot Synchronization

            This pull request automatically synchronizes dependency
            manifests from the website and bot branches.

            ### Updated files
            - security-manifests/website/package.json
            - security-manifests/website/package-lock.json
            - security-manifests/bot/package.json
            - security-manifests/bot/package-lock.json

            ### Purpose
            Keep dependency snapshots up to date for
            security monitoring and vulnerability scanning.

            Generated automatically by GitHub Actions.

          add-paths: |
            security-manifests/website/package.json
            security-manifests/website/package-lock.json
            security-manifests/bot/package.json
            security-manifests/bot/package-lock.json

          delete-branch: true
