name: Deploy Wilderness Odyssey Website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v7
        with:
          ref: website

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content and types
        run: npm run check

      - name: Run focused tests
        run: npm run test

      - name: Build, verify, and upload Astro site
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run build && node scripts/check-built-site.mjs

      - name: Check generated internal links
        shell: bash
        run: |
          set -euo pipefail

          npm run preview -- --port 4173 > /tmp/wilderness-odyssey-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/Wilderness-Odyssey/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --silent --fail http://127.0.0.1:4173/Wilderness-Odyssey/ > /dev/null
          npx --yes linkinator@7.6.1 http://127.0.0.1:4173/Wilderness-Odyssey/ \
            --recurse \
            --skip 'data:.*' \
            --skip 'https://.*'

      - name: Run Lighthouse report
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
